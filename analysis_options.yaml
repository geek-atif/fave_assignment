include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # The vendored backend is not our code. It carries its own
    # analysis_options.yaml, and its test/ folder needs `dart pub get` run
    # inside the package before its imports resolve — its README says so. Left
    # in, a fresh clone reports 73 errors that have nothing to do with this app.
    - packages/fave_fake_backend/**
    # Generated by injectable; it has its own ignore_for_file header.
    - lib/di/injection.config.dart

linter:
  rules:
    # Money is an int of rupees end to end, never a double.
    - avoid_double_and_int_checks
    # A payment record read back from disk must not silently become dynamic.
    - avoid_dynamic_calls
